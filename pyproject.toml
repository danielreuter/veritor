[project]
name = "veritor"
version = "0.2.0"
description = "Sampled verification of large circuits with a covert-capacity bound: Compile, Verify, Bound, Cost"
readme = "README.md"
authors = [
    { name = "danielreuter", email = "dreuter14@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.6.1",
    "numpy>=2.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "types-networkx>=3.6.1.20260728",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "slow: long-running or environment-dependent; skipped unless selected with -m slow",
    "zk: needs the SP1 toolchain and builds/runs the zkVM guest (skips when absent)",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "veritor"
