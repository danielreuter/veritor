[package]
name = "veritor-zk-host"
version.workspace = true
edition.workspace = true

[dependencies]
sp1-sdk = { version = "=6.4.0", features = ["profiling"] }
veritor-zk-common = { workspace = true }
serde = { workspace = true }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
hex = "0.4"

[build-dependencies]
sp1-build = "=6.4.0"
