name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: ".python-version"
          enable-cache: true
      - run: uv sync --locked
      # The default run skips tests marked ``slow`` (tests/conftest.py); they
      # need the SP1 toolchain or minutes of CPU and are run by hand with -m slow.
      - run: uv run pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: ".python-version"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests benchmarks zk

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: ".python-version"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy src/veritor
